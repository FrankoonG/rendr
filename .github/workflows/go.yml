name: go

on:
  push:
    branches: [main, "v1.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: public module boundary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git ls-files '*go.mod' | wc -l)" -ne 1 ]; then
            echo 'the public tree must contain exactly one tracked Go module' >&2
            exit 1
          fi
          if go list -m -f '{{.Path}}' all | grep -Fxq 'github.com/xtls/xray-core'; then
            echo 'xray-core remains in the public module list' >&2
            exit 1
          fi
          if go mod graph | grep -Fq 'github.com/xtls/xray-core@'; then
            echo 'xray-core remains in the public module graph' >&2
            exit 1
          fi
          if go list -deps -test ./... | grep -Fq 'github.com/xtls/xray-core'; then
            echo 'xray-core remains in the public package closure' >&2
            exit 1
          fi
          if git grep -n -E 'github.com/xtls/xray-core|github.com/FrankoonG/rendr/xray' -- '*.go' go.mod go.sum; then
            echo 'xray-specific imports remain in public Go/module files' >&2
            exit 1
          fi
          if git ls-files | grep -Eq '^(xray/|regress/|scripts/regress\.sh$|\.github/workflows/regress\.yml$|docker/regress\.Dockerfile$)'; then
            echo 'private integration or heavy regression assets remain tracked' >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -timeout 180s

      - name: go test -race
        # -race is heavier; run only on linux to keep matrix time
        # reasonable (Windows runners are already slower).
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -count=1 -race -timeout 240s

      - name: go test -bench (smoke)
        # Benchmarks compile + run a single iteration. Catches
        # regressions in benchmark code without burning runner time
        # on actual measurement.
        if: matrix.os == 'ubuntu-latest'
        run: go test -run=^$ -bench=. -benchtime=1x -timeout 60s ./...
